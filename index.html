/* =========================================================================
   JUNGLE CLASH WEB — juego completo en un solo archivo (Canvas + Web Audio)

// ---------- Constantes de diseño (paleta medida del video) ----------

const T = 22, COLS = 18, ROWS = 32;     // casillas de 22 px → arena 396 x 704

const OUT = 'rgba(28,20,10,0.92)';

const DECK = ['grenadier','gunner','colossus','sniper','spies','mecha','bombing','rockets'];
const FIG_H = { grenadier:34, gunner:33, colossus:43, sniper:32, spies:30, mecha:37 };

const DIFFS = {

// ---------- Utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const px = x => AX + x * T, py = y => AY + y * T;
const hyp = Math.hypot;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shade(hex, amt){
  const c = parseInt(hex.slice(1), 16); let r = c >> 16, g = c >> 8 & 255, b = c & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
}
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60), r = s % 60; return m > 0 ? m + 'm ' + r + 's' : r + 's'; }
const store = { get(k,d){ try{ const v = localStorage.getItem('jc_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem('jc_'+k, JSON.stringify(v)); }catch(e){} } };

// ---------- Primitivas de dibujo ----------
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fillRR(g,x,y,w,h,r,fill,stroke,lw){ rr(g,x,y,w,h,r); if(fill){g.fillStyle=fill; g.fill();}
  if(stroke){ g.lineWidth=lw||1.5; g.strokeStyle=stroke; g.stroke(); } }
function circ(g,x,y,r,fill,stroke,lw){ g.beginPath(); g.arc(x,y,Math.max(0.1,r),0,Math.PI*2);
  if(fill){g.fillStyle=fill; g.fill();} if(stroke){ g.lineWidth=lw||1.2; g.strokeStyle=stroke; g.stroke(); } }
function ell(g,x,y,rx,ry,fill,stroke,lw){ g.beginPath(); g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2);
  if(fill){g.fillStyle=fill; g.fill();} if(stroke){ g.lineWidth=lw||1.2; g.strokeStyle=stroke; g.stroke(); } }
function ln(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function limb(g,x1,y1,x2,y2,w,col){ g.lineCap='round'; g.strokeStyle=OUT; g.lineWidth=w+1.6; ln(g,x1,y1,x2,y2);
  g.strokeStyle=col; g.lineWidth=w; ln(g,x1,y1,x2,y2); }
function text(g,s,x,y,size,color,align,stroke,sw){
  g.font = FW + size + 'px ' + FONT; g.textAlign = align || 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (stroke !== null) { g.lineWidth = sw || Math.max(2.5, size * 0.2); g.strokeStyle = stroke || '#1b130a'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function wrapText(g,s,x,y,maxW,lh,size,color,align){
  g.font = FW + size + 'px ' + FONT; const words = s.split(' '); let line = '', yy = y;
  for (const w of words) { const t2 = line ? line + ' ' + w : w;
    if (g.measureText(t2).width > maxW && line) { text(g,line,x,yy,size,color,align,null); line = w; yy += lh; } else line = t2; }
  if (line) text(g,line,x,yy,size,color,align,null); return yy;
}
function starPath(g,x,y,r,ri){ g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?ri:r;
  g.lineTo(x+Math.cos(a)*rad, y+Math.sin(a)*rad);} g.closePath(); }
function drawStar(g,x,y,r,fill,stroke,lw){ starPath(g,x,y,r,r*0.48); g.fillStyle=fill; g.fill(); if(stroke){g.lineWidth=lw||1.5; g.strokeStyle=stroke; g.stroke();} }
function oct(g,cx,cy,rx,ry,c){ const c2=c*ry/rx; g.beginPath(); g.moveTo(cx-rx+c,cy-ry); g.lineTo(cx+rx-c,cy-ry);
  g.lineTo(cx+rx,cy-ry+c2); g.lineTo(cx+rx,cy+ry-c2); g.lineTo(cx+rx-c,cy+ry); g.lineTo(cx-rx+c,cy+ry);
  g.lineTo(cx-rx,cy+ry-c2); g.lineTo(cx-rx,cy-ry+c2); g.closePath(); }
function dropPath(g,x,y,r){ g.beginPath(); g.moveTo(x,y-r*1.45); g.bezierCurveTo(x+r*0.5,y-r*0.7,x+r,y-r*0.2,x+r,y+r*0.25);
  g.arc(x,y+r*0.25,r,0,Math.PI); g.bezierCurveTo(x-r,y-r*0.2,x-r*0.5,y-r*0.7,x,y-r*1.45); g.closePath(); }
function drawDrop(g,x,y,r,gray){ dropPath(g,x,y,r);
  const gr=g.createLinearGradient(x-r,y-r,x+r,y+r); gr.addColorStop(0,gray?'#9a9a9a':'#8e6ad8'); gr.addColorStop(1,gray?'#3a3a3a':PAL.oilDrop);
  g.fillStyle=gr; g.fill(); g.lineWidth=1.4; g.strokeStyle='#120c22'; g.stroke();
  ell(g,x-r*0.35,y-r*0.05,r*0.22,r*0.38,'rgba(255,255,255,0.55)'); }

/* =========================================================================
   AUDIO — todo sintetizado con Web Audio API
   ========================================================================= */
const SND = (() => {
  let ac = null, master, sfx, mus, nb, muted = store.get('mute', false); const last = {};
  function init(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    comp.attack.value = 0.003; comp.release.value = 0.2; comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
    sfx = ac.createGain(); sfx.gain.value = 0.85; sfx.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.3; mus.connect(master);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ready = () => ac && ac.state === 'running' && !muted;
  function gate(k, ms){ const n = performance.now(); if (last[k] && n - last[k] < ms) return false; last[k] = n; return true; }
  function dest(o){ if (o.dest) return o.dest;
    if (o.pan !== undefined && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(o.pan,-1,1); p.connect(sfx); return p; }
    return sfx; }
  function N(o){ const t = o.at !== undefined ? o.at : ac.currentTime + (o.when || 0), d = o.dur || 0.2;
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + d); f.Q.value = o.q || 0.7;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.g || 0.3, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest(o)); s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05); }
  function O(o){ const t = o.at !== undefined ? o.at : ac.currentTime + (o.when || 0), d = o.dur || 0.2;
    const os = ac.createOscillator(); os.type = o.type || 'sine'; os.frequency.setValueAtTime(o.f, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + d);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.g || 0.2, t + (o.a || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    let n = os; if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); n = f; }
    n.connect(g); g.connect(dest(o)); os.start(t); os.stop(t + d + 0.05); }
  const P = x => x === undefined ? undefined : (x - 9) / 9 * 0.7;

  const api = {
    init,
    get muted(){ return muted; },
    get state(){ return ac ? ac.state : 'none'; },
    toggle(){ muted = !muted; store.set('mute', muted); if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.02); return muted; },
    click(){ if(!ready())return; O({f:900,f2:1350,dur:.08,type:'triangle',g:.16}); },
    select(){ if(!ready())return; O({f:620,f2:930,dur:.07,type:'triangle',g:.14}); O({f:1240,dur:.06,type:'sine',g:.05,when:.04}); },
    error(){ if(!ready()||!gate('err',150))return; O({f:180,dur:.1,type:'square',g:.07,lp:900}); O({f:135,dur:.16,type:'square',g:.07,lp:900,when:.11}); },
    deploy(x){ if(!ready())return; N({type:'lowpass',f:600,f2:120,dur:.2,g:.32,pan:P(x)}); O({f:300,f2:640,dur:.14,type:'triangle',g:.12,pan:P(x)});
      for(let i=0;i<3;i++) O({f:1900,dur:.025,type:'square',g:.025,when:.18+i*.27,lp:4000}); },
    land(x){ if(!ready()||!gate('land',60))return; N({type:'lowpass',f:380,f2:70,dur:.2,g:.36,pan:P(x)}); O({f:110,f2:50,dur:.15,g:.25,pan:P(x)}); },
    shot(kind,x){ if(!ready())return; const pan=P(x);
      if(kind==='mg'){ if(!gate('mg',55))return; N({type:'bandpass',f:2300,q:.9,dur:.07,g:.2,pan}); O({f:230,f2:70,dur:.05,type:'square',g:.05,lp:1500,pan}); }
      else if(kind==='tower'){ if(!gate('tw',70))return; N({type:'bandpass',f:1500,f2:500,q:.7,dur:.12,g:.2,pan}); O({f:170,f2:55,dur:.09,type:'triangle',g:.16,pan}); }
      else if(kind==='cannon'){ if(!gate('cn',90))return; N({type:'lowpass',f:1600,f2:180,dur:.32,g:.34,pan}); O({f:95,f2:32,dur:.3,g:.5,pan}); }
      else if(kind==='sniper'){ N({type:'lowpass',f:5000,f2:280,dur:.4,g:.42,pan}); O({f:130,f2:34,dur:.32,g:.5,pan}); N({type:'bandpass',f:1200,dur:.25,g:.06,when:.16,pan}); } },
    throw(x){ if(!ready()||!gate('th',80))return; N({type:'bandpass',f:450,f2:2300,q:1.6,dur:.22,g:.12,pan:P(x)}); },
    explosion(s,x){ if(!ready()||!gate('ex',55))return; const k=Math.min(1.5,s), pan=P(x);
      N({type:'lowpass',f:2600,f2:90,dur:.45+.55*k,g:.5*k,pan}); O({f:125,f2:30,dur:.35+.3*k,g:.7*k,pan});
      for(let i=0;i<3;i++) N({type:'highpass',f:2500,dur:.04,g:.08,when:.05+Math.random()*.25,pan}); },
    punch(x){ if(!ready()||!gate('pu',60))return; N({type:'lowpass',f:900,f2:140,dur:.13,g:.34,pan:P(x)}); O({f:150,f2:52,dur:.13,g:.34,pan:P(x)}); },
    clang(x){ if(!ready()||!gate('cl',60))return; O({f:640,f2:420,dur:.2,type:'square',g:.05,lp:2600,pan:P(x)}); O({f:955,dur:.14,type:'triangle',g:.06,pan:P(x)}); N({type:'highpass',f:2600,dur:.06,g:.12,pan:P(x)}); },
    slash(x){ if(!ready()||!gate('sl',50))return; N({type:'highpass',f:3000,f2:7000,dur:.09,g:.14,pan:P(x)}); },
    death(x){ if(!ready()||!gate('de',50))return; O({f:520,f2:140,dur:.17,type:'square',g:.045,lp:1800,pan:P(x)}); N({type:'lowpass',f:900,f2:200,dur:.22,g:.14,pan:P(x)}); },
    whistle(x){ if(!ready()||!gate('wh',70))return; O({f:2100,f2:650,dur:.42,type:'sine',g:.045,pan:P(x)}); },
    rocket(x){ if(!ready()||!gate('rk',90))return; N({type:'bandpass',f:380,f2:2600,q:1,dur:.75,g:.17,pan:P(x)}); O({f:900,f2:300,dur:.7,type:'sawtooth',g:.025,lp:1600,pan:P(x)}); },
    plane(){ if(!ready())return; const t=ac.currentTime, d=2.6; const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+1.0); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=650; f.connect(g); g.connect(sfx);
      for(const fr of [96,98.6,48]){ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(fr*1.12,t);
        o.frequency.exponentialRampToValueAtTime(fr*0.86,t+d); o.connect(f); o.start(t); o.stop(t+d+0.05); }
      N({type:'lowpass',f:480,dur:d,g:.1,a:1.0}); },
    towerDown(x){ if(!ready())return; last.ex=0; api.explosion(2.4,x); N({type:'lowpass',f:240,f2:55,dur:1.7,g:.42,when:.08}); O({f:70,f2:28,dur:1.2,g:.5,when:.05}); },
    horn(){ if(!ready())return; O({f:233,dur:.32,type:'sawtooth',g:.08,lp:1300}); O({f:311,dur:.55,type:'sawtooth',g:.08,lp:1300,when:.33}); O({f:466,dur:.55,type:'sawtooth',g:.05,lp:1500,when:.33}); },
    general(){ if(!ready())return; const n=[392,523,659,784];
      n.forEach((f,i)=>{ O({f,dur:.2,type:'sawtooth',g:.09,lp:2300,when:i*.11}); O({f:f*2,dur:.18,type:'square',g:.02,lp:3000,when:i*.11}); });
      [523,659,784,1046].forEach(f=>O({f,dur:.85,type:'sawtooth',g:.06,lp:2000,when:.48,a:.03}));
      for(let i=0;i<9;i++) N({type:'highpass',f:1500,dur:.04,g:.09,when:i*.045}); },
    win(){ if(!ready())return; [523,659,784,1046].forEach((f,i)=>O({f,dur:.3,type:'square',g:.06,lp:2500,when:i*.13}));
      [523,659,784,1046].forEach(f=>O({f,dur:1.2,type:'sawtooth',g:.045,lp:2200,when:.55,a:.04})); },
    lose(){ if(!ready())return; [392,311,262,196].forEach((f,i)=>O({f,dur:.4,type:'triangle',g:.12,when:i*.22})); }
